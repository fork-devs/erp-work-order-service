# Validation Messages (English)
validation.work-order.items.not-empty=The work order items list cannot be empty.

validation.work-order.open.customer-id.not-null=Customer identifier is required.
validation.work-order.open.vehicle-id.not-null=Vehicle identifier is required.
validation.work-order.open.branch-id.not-null=Branch identifier is required.
validation.work-order.open.diagnosis.not-blank=Initial diagnosis is required.

validation.work-order.transition.destination.not-blank=Destination status is required.

validation.work-order.item.spare-part-id.not-null=Spare part identifier is required.
validation.work-order.item.quantity.positive=Quantity must be strictly positive.
validation.work-order.item.labor-price.not-null=Labor price is required.

# Error Messages (English)
error.work-order.transition-invalid.title=Invalid Work Order Transition
error.work-order.transition-invalid.detail=The transition to the requested status is not declared by the machine.
error.work-order.saga-transition-reserved.title=Reserved Saga Transition
error.work-order.saga-transition-reserved.detail=The transition runs through its own saga door (quote, approve, reject, cancel).
error.work-order.stock-reservation-conflict.title=Stock Reservation Conflict
error.work-order.stock-reservation-conflict.detail=The inventory rejected the saga operation.
error.work-order.inventory-unavailable.title=Inventory Service Unavailable
error.work-order.inventory-unavailable.detail=The inventory service is unavailable, the operation was retried and failed.
error.work-order.fleet-unavailable.title=Fleet Service Unavailable
error.work-order.fleet-unavailable.detail=The fleet service is unavailable, the order cannot be opened now.
error.work-order.vehicle-unknown.title=Vehicle Unknown
error.work-order.vehicle-unknown.detail=The fleet does not know the vehicle.
error.work-order.vehicle-ownership-mismatch.title=Vehicle Ownership Mismatch
error.work-order.vehicle-ownership-mismatch.detail=The vehicle is not registered to the order's customer.
error.work-order.not-found.title=Work Order Not Found
error.work-order.not-found.detail=The requested work order does not exist.
error.work-order.access-denied.title=Access Denied
error.work-order.access-denied.detail=The principal does not have the role the endpoint demands.
error.work-order.unauthenticated.title=Authentication Required
error.work-order.unauthenticated.detail=The request requires a verified access token.
error.work-order.validation-error.title=Validation Error
error.work-order.validation-error.detail=The request is not valid.
error.work-order.malformed-request.title=Malformed Request
error.work-order.malformed-request.detail=The request body is not readable.
error.work-order.internal-error.title=Internal Error
error.work-order.internal-error.detail=An internal error occurred.
